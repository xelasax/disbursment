            **PARTY TYPE**: The party type for an auth party determines the information you need to enter for that party. 

            If you enter the value **COMPANY** for this field, then you only need to enter the value of `company_name`,`title`, and `party_uuid`. Because this will send an email to the payee to fetch the details of the additional payee for approval.

            If you choose **INDIVIDUAL**, then you will need to enter all the other fields as well such as `email`, `phone`, `first_name` and `last_name`. This will send an email directly to the individual to get their approval for the payee.
