    DisbursmentThirdParties:
      title: DisbursmentThirdParties
      x-stoplight:
        id: utcqezoa06yba
      type: object
      description: |-
        The purpose of adding a third party is to send multiple checks as a bundle at the third party address.
        We can include the same third party to multiple payees. So that all the checks of each payee will be sent to a third party address.
      properties:
        party_uuid:
          type: string
          description: The party UUID should be unique to distinguish between all the Third Party.
          example: 123e4567-e89b-12d3-a456-426614174000
        address_one:
          type: string
          description: Address one of the third party.
          example: 123 Main Street
        address_two:
          type: string
          description: Address two of the third party.
          example: Suite 456
          nullable: true
        first_name:
          type: string
          description: First name of the third party.
          example: John
        last_name:
          type: string
          description: Last name of the third party.
          example: Doe
          nullable: true
        city:
          type: string
          description: City name of the third party.
          example: San Francisco
        state:
          type: string
          description: 'State should be entered in the short description. For example, ''Florida'' should be entered as ''FL''.'
          example: CA
        zip_code:
          type: string
          description: Third party zip code.
          example: '94103'
        phone:
          type: string
          description: Third party phone.
          example: '+1234567890'
          nullable: true
        company_name:
          type: string
          description: Name of third party company.
          example: Acme Corporation
        payment_method_settings:
          type: object
          required:
            - value
          properties:
            check_postage_type:
              type: string
              description: |
                Enter the postage type code in this field and if the payee chooses the Direct disburse delivery option or set flag is_sent_thirdparty true the postal check will be sent with this postage type. Check the POSTAGE_CODES enum below for the accepted postage codes.
              example: Standard
            value:
              type: string
              x-stoplight:
                id: qsx34eyzkc62c
              description: Value of the postage type.
        country:
          type: string
          description: |
            Two-letter country code (e.g., "CA" for Canada). Omit for US domestic payments (default is "US"). Note: Set `is_it_international_payment` to true for international payments.
          example: US
          nullable: true
        is_it_international_payment:
          type: boolean
          description: |
            This flag is used to send the check to an international address.  For domestic payments within the US, set to false or omit the field.
          example: false
      required:
        - party_uuid
        - address_one
        - first_name
        - city
        - state
        - zip_code
        - company_name
        - payment_method_settings
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: Represents the `access_token` obtain in the response body after successful authentication. It is used for authentication and authorization in the DisburseCloud API ecosystem. It serves as a secure and temporary credential that grants access to protected resources and functionalities.
    Basic:
      type: http
      scheme: basic
      description: |-
        It involves sending the user's credentials (typically username and password) encoded in the request headers, providing a straightforward mechanism for accessing protected resources.
        <br/>
        Authentication to obtain an `access_token` is done using the __Company TIN__ as the `username` and __User API key__ as the `password`.
  parameters:
    CompanyApiKey:
      name: CompanyApiKey
      in: header
      schema:
        type: string
      description: 'The Company API Key is a unique authentication credential provided by DisburseCloud to each registered company. This key serves as a secure identifier for the company''s access to DisburseCloud services and resources. <br/>  __<span style="color:red">REQUIRED</span> for only Multi-Company Users__'
